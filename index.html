<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-wallet"></i> Expense Tracker</h1>
        <div class="header-actions">
            <button id="export-btn" class="btn secondary"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button id="theme-toggle" class="btn icon-btn"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="dashboard">
        <div class="summary-cards">
            <div class="card income">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="card expense">
                <h3>Total Expense</h3>
                <p id="total-expense">₹0.00</p>
            </div>
            <div class="card balance">
                <h3>Current Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel form-panel">
                <h2 id="form-title">New Transaction</h2>
                <form id="transaction-form">
                    <input type="hidden" id="tx-id">
                    <div class="input-group">
                        <input type="text" id="desc" placeholder="Description (e.g., Groceries)" required>
                    </div>
                    <div class="input-row">
                        <input type="number" id="amount" placeholder="Amount" step="0.01" required>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense" selected>Expense</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <select id="category" required>
                            <!-- Categories loaded dynamically -->
                        </select>
                        <button type="button" id="add-category-btn" class="btn icon-btn secondary" title="Add New Category"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="input-group">
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" id="submit-btn" class="btn primary full-width">Add Transaction</button>
                </form>
            </div>

            <div class="panel chart-panel">
                <h2>Expense Breakdown</h2>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="panel list-panel">
            <div class="list-header">
                <h2>Transaction History</h2>
                <div class="filters">
                    <input type="text" id="search" placeholder="Search description...">
                    <select id="filter-type">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="filter-category">
                        <option value="all">All Categories</option>
                    </select>
                    <input type="date" id="filter-start" title="Start Date">
                    <input type="date" id="filter-end" title="End Date">
                </div>
            </div>
            <div class="table-container">
                <table id="transaction-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
